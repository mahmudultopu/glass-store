<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop – SHADEO</title>
  <meta name="description" content="Polarized, aviator, cat eye and oversized sunglasses, prescription eyeglasses and blue-light glasses. 100% UV400. Cash on Delivery across Bangladesh.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23F5A623'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
  <!-- Page: Collection page. ?c= picks the collection (see SHADEO_CATEGORIES in data.js), ?shape= and ?q= pre-filter. Logic: assets/js/pages/shop.js.
       Header, menus, cart drawer and footer are injected into #site-header / #site-footer by assets/js/app.js. -->
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="page-width">
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span id="crumb">Shop</span></nav>
        <h1 id="shop-title">Shop All</h1>
        <p id="shop-desc"></p>
        <div class="cat-chips" id="cat-chips"></div>
      </div>
    </section>

    <div class="page-width shop">
      <aside class="filters" id="filters-desktop" aria-label="Filters"></aside>
      <div>
        <div class="toolbar">
          <span class="toolbar__count" id="count" aria-live="polite"></span>
          <div class="toolbar__right">
            <button class="btn btn--outline btn--sm filter-toggle" type="button" data-open="filter-drawer"><span data-icon="filter" style="width:16px;display:inline-flex"></span>Filter</button>
            <label class="visually-hidden" for="sort">Sort by</label>
            <select class="select" id="sort">
              <option value="featured">Featured</option>
              <option value="best">Bestselling</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="new">Newest</option>
            </select>
          </div>
        </div>
        <div class="active-filters" id="active-filters"></div>
        <ul class="grid" id="grid" role="list"></ul>
      </div>
    </div>

    <aside class="drawer drawer--left" id="filter-drawer" aria-label="Filters" aria-hidden="true">
      <div class="drawer__head"><h2>Filter</h2><button class="icon-btn" type="button" data-close aria-label="Close filters"><span data-icon="close"></span></button></div>
      <div class="drawer__body" id="filters-mobile"></div>
      <div class="drawer__foot"><button class="btn btn--block" type="button" data-close id="show-results">Show results</button></div>
    </aside>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/frames.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/shop.js"></script>
</body>
</html>
